openapi: 3.1.0
info:
  title: JJM Meter Reading Extraction API(s)
  description: >-
    Extracts water meter readings from images and collects feedback on them.
    Base path `/flowvision/v1`.


    Note: processing errors are returned with HTTP status 200 and
    `responseCode: ERROR` / `statusCode: 500` in the body. Only request
    validation failures return a non-200 HTTP status (422).
  version: v1
paths:
  /:
    get:
      tags:
        - health
      summary: Liveness check
      operationId: root__get
      responses:
        '200':
          description: Service is up and models are loaded
          content:
            application/json:
              example:
                message: Hi, I am the meter reading assistant.
  /flowvision/v1/extract-reading:
    post:
      tags:
        - image-handlers
      summary: Extract Reading
      description: >-
        Downloads the image at `imageURL`, checks its quality, detects the
        meter digits and returns the reading.
      operationId: extract_reading_flowvision_v1_extract_reading_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReadingExtractionRequest'
            examples:
              minimal:
                summary: Only the image URL
                value:
                  imageURL: https://my-bucket.s3.amazonaws.com/meters/1234.jpg
              full:
                summary: With request ID, timestamp and metadata
                value:
                  id: 2800d121-02b4-471d-bc33-be3a56f8db2a
                  ts: '2026-09-24T10:40:17'
                  imageURL: https://my-bucket.s3.amazonaws.com/meters/1234.jpg
                  metadata:
                    meterId: M7711086
      responses:
        '200':
          description: >-
            Request processed (check `result.status`), or a processing error
            (`responseCode: ERROR`, see the `error` example).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadingExtractionResponse'
              examples:
                success:
                  summary: Reading extracted
                  value:
                    id: 44939270-210b-467d-a73a-ca32d9ee8591
                    ts: '2026-09-24T10:40:17.559018'
                    responseCode: OK
                    statusCode: 200
                    result:
                      status: SUCCESS
                      correlationId: 71e6df84-463a-4fd7-b659-769e20bbbf23
                      data:
                        meterReading: '024965'
                        processingTime: 0.466612
                        qualityStatus: good
                        qualityConfidence: 0.6666
                        lastDigitColor: black
                        colorConfidence: 0.9723
                unclear:
                  summary: Image rejected by the quality check
                  value:
                    id: 5054dd8b-d4cb-43b4-952b-97ccfa2d60ce
                    ts: '2026-09-24T10:48:24.504769'
                    responseCode: OK
                    statusCode: 200
                    result:
                      status: UNCLEAR
                      correlationId: 43421856-db05-4a46-a2a3-00d59112d37f
                      data:
                        meterReading: Image quality too poor for recognition
                        processingTime: 0.173178
                        qualityStatus: bad
                        qualityConfidence: 0.8969
                        lastDigitColor: unknown
                        colorConfidence: 0.0
                error:
                  summary: Processing error (still HTTP 200)
                  value:
                    id: b901b35c-7b24-4ad0-a1e9-1d1f853e127c
                    ts: '2026-09-24T10:48:25.413109'
                    responseCode: ERROR
                    statusCode: 500
                    error:
                      errorCode: 500
                      errorMsg: >-
                        404 Client Error: Not Found for url:
                        https://my-bucket.s3.amazonaws.com/meters/missing.jpg
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /flowvision/v1/feedback:
    post:
      tags:
        - feedback
      summary: Provide Feedback
      description: Records whether an extracted reading was correct.
      operationId: log_feedback_flowvision_v1_feedback_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
            examples:
              feedback:
                summary: Reading was wrong
                value:
                  correlationId: 71e6df84-463a-4fd7-b659-769e20bbbf23
                  data:
                    accurate: false
                    extracted: 24965
                    actual: 24963
      responses:
        '200':
          description: Feedback accepted (stored in the background)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackResponse'
              example:
                id: 772d8818-9cf0-41f4-87e7-c24867d84e4d
                ts: '2026-09-24T10:48:25.540585'
                responseCode: OK
                statusCode: 200
                result:
                  status: SUBMITTED
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ReadingExtractionRequest:
      type: object
      required:
        - imageURL
      properties:
        id:
          type: string
          format: uuid
          description: Client request ID. Generated if omitted.
        ts:
          type: string
          format: date-time
          description: Request timestamp. Defaults to time of receipt.
        imageURL:
          type: string
          description: HTTP(S) URL of a JPEG or PNG meter image, reachable from the server.
        metadata:
          anyOf:
            - type: object
            - type: 'null'
          description: Arbitrary JSON stored with the request.
    ReadingExtractionResponse:
      type: object
      required:
        - id
        - ts
        - responseCode
        - statusCode
      properties:
        id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        responseCode:
          $ref: '#/components/schemas/ResponseCode'
        statusCode:
          type: integer
          description: 200 when processed, 500 on a processing error.
        error:
          $ref: '#/components/schemas/Error'
        result:
          $ref: '#/components/schemas/ReadingExtractionResult'
    ReadingExtractionResult:
      type: object
      required:
        - status
        - correlationId
      properties:
        status:
          $ref: '#/components/schemas/Status'
        correlationId:
          type: string
          format: uuid
          description: Pass to /feedback to rate this reading.
        data:
          $ref: '#/components/schemas/ReadingExtractionResultData'
    ReadingExtractionResultData:
      type: object
      required:
        - processingTime
        - qualityStatus
        - qualityConfidence
        - lastDigitColor
        - colorConfidence
      properties:
        meterReading:
          type: string
          description: >-
            Digits read left to right (leading zeros kept, no decimal point),
            or a short reason when status is UNCLEAR.
        processingTime:
          type: number
          description: Seconds spent on the request, including image download.
        qualityStatus:
          type: string
          enum:
            - good
            - bad
        qualityConfidence:
          type: number
          minimum: 0
          maximum: 1
        lastDigitColor:
          type: string
          enum:
            - black
            - red
            - unknown
        colorConfidence:
          type: number
          minimum: 0
          maximum: 1
    Status:
      type: string
      description: NOMETER is reserved and not currently returned.
      enum:
        - SUCCESS
        - UNCLEAR
        - NOMETER
    FeedbackRequest:
      type: object
      required:
        - correlationId
        - data
      properties:
        id:
          type: string
          format: uuid
          description: Client request ID. Generated if omitted.
        ts:
          type: string
          format: date-time
          description: Feedback timestamp. Defaults to time of receipt.
        correlationId:
          type: string
          format: uuid
          description: result.correlationId from the extraction response.
        data:
          $ref: '#/components/schemas/FeedbackRequestData'
    FeedbackRequestData:
      type: object
      required:
        - accurate
      properties:
        accurate:
          type: boolean
        extracted:
          anyOf:
            - type: number
            - type: 'null'
          description: The reading that was extracted (logged, not stored).
        actual:
          anyOf:
            - type: number
            - type: 'null'
          description: The correct reading, if known.
    FeedbackResponse:
      type: object
      required:
        - id
        - ts
        - responseCode
        - statusCode
      properties:
        id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        responseCode:
          $ref: '#/components/schemas/ResponseCode'
        statusCode:
          type: integer
        error:
          $ref: '#/components/schemas/Error'
        result:
          type: object
          required:
            - status
          properties:
            status:
              type: string
              enum:
                - SUBMITTED
                - FAILED
    ResponseCode:
      type: string
      enum:
        - OK
        - ERROR
    Error:
      type: object
      required:
        - errorCode
        - errorMsg
      properties:
        errorCode:
          anyOf:
            - type: string
            - type: integer
        errorMsg:
          type: string
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
    ValidationError:
      type: object
      required:
        - loc
        - msg
        - type
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
